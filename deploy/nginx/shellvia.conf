# Shellvia marketing site: installed by deploy/setup-vps.sh as
# /etc/nginx/sites-available/shellvia.conf. Only the six names below are
# served here; the other sites on the server are not touched.

# HTTP: Let's Encrypt challenges, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name shellvia.com www.shellvia.com shellvia.fr www.shellvia.fr shellvia.app www.shellvia.app;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Other names: one permanent redirect to the canonical host (shellvia.fr keeps
# its visitors in French).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.shellvia.com shellvia.app www.shellvia.app;
    include /etc/nginx/snippets/shellvia-tls.conf;
    return 301 https://shellvia.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shellvia.fr www.shellvia.fr;
    include /etc/nginx/snippets/shellvia-tls.conf;
    return 301 https://shellvia.com/fr$request_uri;
}

# The site itself: the static export uploaded by the Deploy workflow.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shellvia.com;
    include /etc/nginx/snippets/shellvia-tls.conf;

    root /var/www/shellvia;
    index index.html;
    # Redirects added by nginx (/download -> /download/) stay on this host.
    absolute_redirect off;
    error_page 404 /404.html;

    location / {
        include /etc/nginx/snippets/shellvia-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Hashed file names: safe to cache for a year.
    location /_next/static/ {
        include /etc/nginx/snippets/shellvia-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Dot files (none are published) are never served.
    location ~ /\. {
        return 404;
    }
}

# Included in each location: an add_header there would drop server-level ones.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; connect-src 'self' https://api.github.com https://cloud.umami.is https://api-gateway.umami.dev; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'" always;
